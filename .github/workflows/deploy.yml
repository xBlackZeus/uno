name: Deploy client to GitHub Pages

# The browser game is static, so it lives on Pages. The live game still needs the
# Node server; UNO_SERVER_URL (a repository secret) points the client at it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verify the rules before publishing anything.
      - run: npm ci
      - run: npm test

      - name: Point the client at the game server
        env:
          UNO_SERVER_URL: ${{ secrets.UNO_SERVER_URL }}
        run: |
          URL="${UNO_SERVER_URL:-}"
          printf 'window.UNO_SERVER_URL = "%s";\n' "$URL" > public/config.js
          echo "server: ${URL:-same-origin}"

      # enablement: lets a fork enable its own Pages, so the workflow does not
      # fail on a repo where Pages has never been switched on.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4